            - generic [ref=e113]:
              - paragraph [ref=e115]: Decided to try chiseling box joints, which started off rough but eventually turned out quite nice. For me the heureka moment was realizing that since I planned the joints to be 20mm in width, I could use my 20mm chisel as a measuring tool. Having a physical object with a fixed width is much more reliable than relying on markers made using a ruler or combination square. The quality in the joints increased drastically after trying this out and it's definitely going to be my go-to approach for these things in the future as well, where I will do my best to design joints with the same widths as my chisels.
