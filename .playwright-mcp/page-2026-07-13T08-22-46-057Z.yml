              - paragraph [ref=e265]: Drawerboxes are 15mm ash with a 8mm veneer bottom. Used Häfele soft-close hardware which was a dream to work with. For the slider installation a good method is to calculate the height you need the sliders to be at and use that dimension to cut a piece of veneer, which can be used to consistently hold the sliders on a fixed height, allowing for a quick, easy, consistent installation. Once the top ones are installed, the veneer can be cut to the next height and whole process repeated.
