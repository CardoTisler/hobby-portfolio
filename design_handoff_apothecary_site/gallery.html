<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Work — Cardo Tisler</title>
<meta name="description" content="The complete catalogue of works by Cardo Tisler.">
<link rel="stylesheet" href="apothecary.css">
<style>
.page-head{ padding:clamp(40px,6vw,76px) 0 clamp(20px,3vw,34px); text-align:center; }
.page-head .label{ margin-bottom:18px; }
.page-head h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(2.4rem,5.5vw,4rem); margin:0; line-height:1.05;
}
.page-head .deck{ color:var(--brown); max-width:50ch; margin:18px auto 0; }
.page-head .ornament{ max-width:300px; margin:28px auto 0; }

/* filter bar */
.filters{
  display:flex; justify-content:center; flex-wrap:wrap; gap:10px;
  margin:18px 0 6px;
}
.filters button{
  font-family:var(--fell-sc); font-size:0.76rem; letter-spacing:0.18em;
  text-transform:uppercase; cursor:pointer;
  background:transparent; color:var(--brown);
  border:1px solid var(--line); padding:9px 20px;
  transition:background .2s, color .2s, border-color .2s;
}
.filters button:hover{ border-color:var(--brown); color:var(--ink); }
.filters button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.count{
  text-align:center; font-family:var(--mono); font-size:0.72rem;
  color:var(--brown-soft); margin:14px 0 0;
}

.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(18px,2.4vw,30px); margin:36px 0 0; }
.specimen{ animation:fade .4s ease both; }
@keyframes fade{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none; } }

@media(max-width:860px){ .grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:560px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="masthead" data-screen-label="Masthead">
  <div class="wrap">
    <div class="estd">
      <span>Tartu · Estonia</span>
    </div>
    <div class="bar">
      <a class="brand" href="index.html">Cardo Tisler</a>
      <nav class="nav">
        <a href="gallery.html" data-cat="Woodworking">Woodworking</a>
        <a href="gallery.html" data-cat="Renovation">Renovation</a>
        <a href="gallery.html" data-cat="Garden">Garden</a>
        <a href="gallery.html" class="active">All Work</a>
      </nav>
    </div>
  </div>
</header>

<main>
<section class="wrap page-head" data-screen-label="Page Head">
  <p class="label">The Complete Catalogue</p>
  <h1>All Work</h1>
  <p class="deck">Every commission and self-set project, recorded with its materials and joinery noted.</p>
  <div class="ornament"><span class="mark">&#10087;</span></div>
</section>

<section class="wrap" data-screen-label="Catalogue">
  <div class="filters" id="filters"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</section>
</main>

<footer class="foot" data-screen-label="Footer">
  <div class="wrap">
    <div class="logo-wrap">
      <image-slot id="footer-logo" placeholder="" fit="contain"></image-slot>
      <p class="logo-hint">Drop your logo here</p>
    </div>
  </div>
</footer>

<script src="projects.js"></script>
<script>
const cats = ['All Work','Woodworking','Renovation','Garden'];
const filters = document.getElementById('filters');
const grid = document.getElementById('grid');
const count = document.getElementById('count');
let active = 'All Work';

// honour ?cat= from nav links
const params = new URLSearchParams(location.search);
if(params.get('cat') && cats.includes(params.get('cat'))) active = params.get('cat');

filters.innerHTML = cats.map(c => `<button data-c="${c}">${c}</button>`).join('');

function render(){
  [...filters.children].forEach(b => b.classList.toggle('active', b.dataset.c === active));
  const list = active === 'All Work' ? PROJECTS : PROJECTS.filter(p => p.cat === active);
  count.textContent = `${list.length} ${list.length === 1 ? 'project' : 'projects'} recorded`;
  grid.innerHTML = list.map((p,i) => `
    <a class="specimen" href="project.html?p=${p.slug}" style="animation-delay:${i*55}ms">
      <div class="plate">
        <span class="no">${p.no}</span>
        <span class="cap">[ ${p.cap} ]</span>
      </div>
      <span class="cat">${p.cat}</span>
      <h3>${p.title}</h3>
      <div class="plate-no-label">${p.wood} — ${p.year}</div>
    </a>`).join('');
}
filters.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  active = b.dataset.c; render();
});
render();
</script>
<script src="image-slot.js"></script>
</body>
</html>
