<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardo Tisler — Woodworking, Renovation & Garden</title>
<meta name="description" content="Cardo Tisler — Woodworking, renovation, and garden projects in Estonia.">
<link rel="stylesheet" href="apothecary.css">
<style>
/* ---------- Home-only ---------- */
.hero{ padding:clamp(54px,8vw,104px) 0 clamp(40px,5vw,64px); }

.hero .label{ text-align:center; margin-bottom:20px; }
.hero h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(2.2rem,5vw,3.9rem);
  line-height:1.06; letter-spacing:0.005em;
  text-align:center; margin:0 auto; max-width:18ch;
  text-wrap:balance;
}
.hero h1 em{ font-family:var(--fell); font-style:italic; font-weight:400; color:var(--brown); }
.hero .deck{
  text-align:center; max-width:54ch; margin:24px auto 0;
  color:var(--brown); font-size:1.12rem;
}
.hero .ornament{ max-width:340px; margin:30px auto 30px; }
.hero .cta{
  display:flex; justify-content:center;
}
.btn{
  font-family:var(--fell-sc); font-size:0.82rem; letter-spacing:0.2em;
  text-transform:uppercase; text-decoration:none;
  color:var(--paper); background:var(--ink);
  padding:14px 34px; border:1px solid var(--ink);
  display:inline-block; transition:background .25s, color .25s;
}
.btn:hover{ background:transparent; color:var(--ink); }
.btn.ghost{ background:transparent; color:var(--ink); }
.btn.ghost:hover{ background:var(--ink); color:var(--paper); }

/* ledger strip */
.ledger{
  display:grid; grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line); border-bottom:none;
  background:var(--paper-card);
}
.ledger div{
  padding:26px clamp(18px,3vw,34px);
  border-bottom:1px solid var(--line);
}
.ledger div + div{ border-left:1px solid var(--line); }
.ledger .label{ margin-bottom:10px; }
.ledger .val{ font-family:var(--serif); font-size:1.32rem; font-weight:700; line-height:1.2; }

/* recent work */
.section-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:24px; margin:74px 0 8px; flex-wrap:wrap;
}
.section-head h2{
  font-family:var(--serif); font-weight:700; font-size:clamp(1.7rem,3.4vw,2.5rem);
  margin:0; letter-spacing:0.01em; white-space:nowrap;
}
.section-head .link{
  font-family:var(--fell-sc); font-size:0.78rem; letter-spacing:0.16em;
  text-transform:uppercase; text-decoration:none; color:var(--brown);
  border-bottom:1px solid var(--line); padding-bottom:2px;
  transition:border-color .25s, color .25s;
}
.section-head .link:hover{ color:var(--ink); border-color:var(--ink); }

.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(18px,2.4vw,30px); margin-top:28px; }

@media(max-width:860px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .ledger{ grid-template-columns:1fr; }
  .ledger div + div{ border-left:none; }
}
@media(max-width:560px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- ================= MASTHEAD ================= -->
<header class="masthead" data-screen-label="Masthead">
  <div class="wrap">
    <div class="estd">
      <span>Tartu · Estonia</span>
    </div>
    <div class="bar">
      <a class="brand" href="index.html">Cardo Tisler</a>
      <nav class="nav">
        <a href="gallery.html?cat=Woodworking">Woodworking</a>
        <a href="gallery.html?cat=Renovation">Renovation</a>
        <a href="gallery.html?cat=Garden">Garden</a>
        <a href="gallery.html">All Work</a>
      </nav>
    </div>
  </div>
</header>

<main>
<!-- ================= HERO ================= -->
<section class="hero" data-screen-label="Hero">
  <div class="wrap">
    <p class="label">Catalogue of Works</p>
    <h1>Woodworking, renovation &amp; <em>garden</em> craft</h1>
    <div class="ornament"><span class="mark">&#10087;</span></div>
    <div class="cta">
      <a class="btn ghost" href="gallery.html">View the Work</a>
    </div>
  </div>
</section>

<!-- ================= RECENT WORK ================= -->
<section class="wrap" data-screen-label="Recent Work">
  <div class="section-head">
    <h2>Recent Work</h2>
    <a class="link" href="gallery.html">View all projects &rarr;</a>
  </div>
  <hr class="rule">
  <div class="grid" id="recent"></div>
</section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="foot" data-screen-label="Footer">
  <div class="wrap">
    <div class="logo-wrap">
      <image-slot id="footer-logo" placeholder="" fit="contain"></image-slot>
      <p class="logo-hint">Drop your logo here</p>
    </div>
  </div>
</footer>

<script src="projects.js"></script>
<script>
const recent = document.getElementById('recent');
recent.innerHTML = PROJECTS.map(p => `
  <a class="specimen" href="project.html?p=${p.slug}">
    <div class="plate">
      <span class="no">${p.no}</span>
      <span class="cap">[ ${p.cap} ]</span>
    </div>
    <div class="meta">
      <h3>${p.title}</h3>
      <span class="cat">${p.cat}</span>
    </div>
    <div class="plate-no-label">${p.wood} &middot; ${p.year}</div>
  </a>`).join('');
</script>
<script src="image-slot.js"></script>
</body>
</html>
